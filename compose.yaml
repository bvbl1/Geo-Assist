name: geoassist
services:
  mongo:
    image: mongo:8.0.12
    command: [mongod, --replSet, rs0, --bind_ip_all]
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand({ping:1}).ok ? quit(0) : quit(1)"]
      interval: 3s
      timeout: 5s
      retries: 30
  mongo-init:
    image: mongo:8.0.12
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./deploy/init-replica.js:/init-replica.js:ro
    entrypoint: [mongosh, --host, mongo:27017, --quiet, /init-replica.js]
    restart: "no"
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      WEB_DIR: /app/web
      APP_ORIGIN: "${APP_ORIGIN:-http://localhost:8080}"
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
      MONGO_DATABASE: "${MONGO_DATABASE:-geoassist}"
      COOKIE_SECURE: "false"
      AUTO_SEED: "${AUTO_SEED:-true}"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20
    restart: unless-stopped
volumes:
  mongo_data:
